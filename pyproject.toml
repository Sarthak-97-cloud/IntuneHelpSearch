[project]
name = "module2-rag"
version = "0.1.0"
description = "Module 2 - RAG: text representation, vector DBs, LangChain + LlamaIndex pipelines, HireFlow project"
requires-python = ">=3.11,<3.12"


dependencies = [
    # --- LangChain 0.3.x family ----------------------------------------------
    # Pinned as a set: these versions are mutually compatible and are what the
    # session 6/8 and HireFlow notebooks were written against.
    "langchain==0.3.27",
    "langchain-core==0.3.74",
    "langchain-community==0.3.27",
    "langchain-text-splitters==0.3.9",
    "langchain-google-genai==2.1.9",
    "langchain-openai==0.3.31",
    "langchain-pinecone==0.2.11",

    # --- LlamaIndex (sessions 7 and 8) ---------------------------------------
    "llama-index-core>=0.10.35",
    "llama-index-embeddings-google-genai>=0.2.0",
    "llama-index-llms-google-genai>=0.2.0",
    "llama-index-vector-stores-pinecone>=0.2.0",
    "llama-index-readers-file>=0.2.0",

    # --- Vector stores and retrieval -----------------------------------------
    "pinecone==7.3.0",
    "pinecone-text==0.11.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.0",
    "lark==1.2.2",

    # Imported directly by session 1 (AutoTokenizer, torch tensors). They also
    # arrive via sentence-transformers, but declare them so the notebooks do not
    # depend on someone else's transitive dependency.
    "transformers>=4.44.0",
    "torch>=2.4.0",

    # --- Classical text representation (session 1) ---------------------------
    # gensim caps numpy below 2.0, which is why numpy is pinned to 1.x for the
    # whole module. See session1.ipynb (Word2Vec).
    "gensim==4.3.3",
    "numpy<2",
    "scipy<1.14",
    "scikit-learn==1.7.1",
    "nltk==3.9.2",

    # --- Document loading and parsing ----------------------------------------
    # Relaxed from Hireflow's ==6.0.0: llama-index-readers-file needs >=6.1.3
    # at the versions that also allow pandas 2.3.x.
    "pypdf>=6.1.3",
    "reportlab>=4.1.0",
    "unstructured==0.18.13",
    "unstructured-client==0.42.3",
    "beautifulsoup4>=4.12.0",

    # --- Evaluation -----------------------------------------------------------
    "ragas==0.2.0",
    "datasets>=2.19.0",

    # --- LLM SDKs -------------------------------------------------------------
    "google-genai>=2.17,<3",
    "openai>=1.60.0",
    "instructor>=1.5.0",

    # --- HireFlow app (Streamlit UI + FastAPI backend) ------------------------
    "streamlit==1.48.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pandas==2.3.2",
    # relaxed from ==2.11.7: google-genai 2.x requires pydantic>=2.12.5
    "pydantic[email]>=2.12.5,<3",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",

    # --- Misc -----------------------------------------------------------------
    "nest-asyncio>=1.6.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "langsmith>=0.1.140",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.10.0",

    # --- Tests ----------------------------------------------------------------
    "pytest>=8.0.0",

    # --- Notebook kernel (replaces the conda kernel) --------------------------
    "ipykernel>=6.29.0",
    # tqdm progress bars inside notebooks need IProgress, otherwise every
    # model download prints a TqdmWarning.
    "ipywidgets>=8.1.0",
]
